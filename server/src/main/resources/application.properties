spring.application.name=weather-forecast-service

# JPA config
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.docker.compose.enabled=false

# 3rd-party API config
third.party.api.weather.current=${THIRD_PARTY_API_CURRENT_WEATHER}
third.party.api.weather.forecast=${THIRD_PARTY_API_WEATHER_FORECAST}
third.party.api.key=${THIRD_PARTY_API_KEY}

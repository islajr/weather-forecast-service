spring.application.name=weather-forecast-service

# JPA config
spring.datasource.url={SPRING_DATASOURCE_URL}
spring.datasource.username={SPRING_DATASOURCE_USERNAME}
spring.datasource.password={SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver

# 3rd-party API config
openweathermap.api.weather.city.current={THIRD_PARTY_API_CURRENT-WEATHER}
openweathermap.api.weather.city.forecast={THIRD_PARTY_API_WEATHER-FORECAST}
openweathermap.api.key={THIRD_PARTY_API_KEY}
